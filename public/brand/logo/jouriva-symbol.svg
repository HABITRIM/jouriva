<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="jt jd">
  <title id="jt">JOURIVA symbol</title>
  <desc id="jd">Stylized letter J whose bowl is a rising journey-path crossing the horizon line; an eight-point Moroccan star serves as the dot (tittle) of the J.</desc>
  <!-- JOURIVA primary symbol — "Horizon Path".
       Built to the approved visual direction (owner-authorized):
       · the J is the structural element; the path is its bowl, rising toward the horizon
       · the horizon is a clean colour split through the glyph (navy sky / terracotta path)
       · the 8-point star is the tittle (dot) of the J — crowning the stem, not a separate icon
       · no dotted horizon, no airplane/globe/luggage/compass, no ornamentation
       Replace with designer masters under the same filenames — consumers auto-detect. -->
  <defs>
    <clipPath id="sky"><rect x="0" y="0" width="128" height="66"/></clipPath>
    <clipPath id="land"><rect x="0" y="66" width="128" height="62"/></clipPath>
  </defs>
  <!-- J stem above the horizon -->
  <path fill="#0D2B45" clip-path="url(#sky)" d="M71 34H85V74C85 89.5 75.5 98.5 62.5 98.5C51.5 98.5 42.5 92.3 38.5 82.3L38.5 73.5L52 69.5C53.6 75.6 57.3 78.6 62.5 78.6C68.7 78.6 71 74.6 71 68.5Z"/>
  <!-- J bowl + rising terminal below the horizon = the journey path -->
  <path fill="#C86845" clip-path="url(#land)" d="M71 34H85V74C85 89.5 75.5 98.5 62.5 98.5C51.5 98.5 42.5 92.3 38.5 82.3L38.5 73.5L52 69.5C53.6 75.6 57.3 78.6 62.5 78.6C68.7 78.6 71 74.6 71 68.5Z"/>
  <!-- Eight-point star as the tittle of the J -->
  <path fill="#C86845" fill-rule="evenodd" d="M78 9L80.3 14.46L85.78 12.22L83.54 17.7L89 20L83.54 22.3L85.78 27.78L80.3 25.54L78 31L75.7 25.54L70.22 27.78L72.46 22.3L67 20L72.46 17.7L70.22 12.22L75.7 14.46Z M79.15 17.23L80.77 18.85L80.77 21.15L79.15 22.77L76.85 22.77L75.23 21.15L75.23 18.85L76.85 17.23Z"/>
</svg>
